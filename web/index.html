<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>VST Visualizer - Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #visualizer-canvas, .deck-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    [hidden] { display: none !important; }
    #status-badge {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.825rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    #status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f87171;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    #error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f87171;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      z-index: 2000;
    }
    #error-overlay h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <canvas id="visualizer-canvas"></canvas>

  <div id="status-badge" style="display: none;">
    <span class="dot"></span>
    <span id="status-text">Verbindung getrennt &middot; Verbinde erneut...</span>
  </div>

  <div id="error-overlay">
    <h1>WebGL 2 erforderlich</h1>
    <p>Dieser Browser unterstützt kein WebGL 2 oder Hardware-Beschleunigung ist deaktiviert.</p>
  </div>

  <script src="vendor/butterchurn.min.js"></script>
  <script src="vendor/butterchurnPresets.min.js"></script>
  <script src="vendor/butterchurnPresetsExtra.min.js"></script>
  <script src="ws.js"></script>
  <script src="postfx.js"></script>
  <script src="viz.js"></script>
  <script src="engine.js"></script>
  <script>window.vj = VJEngine.start();</script>
</body>
</html>
