<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VST Visualizer - Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #visualizer-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #status-badge {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.825rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    #status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f87171;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    #error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f87171;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      z-index: 2000;
    }
    #error-overlay h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <canvas id="visualizer-canvas"></canvas>

  <div id="status-badge" style="display: none;">
    <span class="dot"></span>
    <span id="status-text">Verbindung getrennt &middot; Verbinde erneut...</span>
  </div>

  <div id="error-overlay">
    <h1>WebGL 2 erforderlich</h1>
    <p>Dieser Browser unterstützt kein WebGL 2 oder Hardware-Beschleunigung ist deaktiviert.</p>
  </div>

  <script src="vendor/butterchurn.min.js"></script>
  <script src="vendor/butterchurnPresets.min.js"></script>
  <script src="vendor/butterchurnPresetsExtra.min.js"></script>
  <script src="ws.js"></script>
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('visualizer-canvas');
      const statusBadge = document.getElementById('status-badge');
      const errorOverlay = document.getElementById('error-overlay');

      // Check WebGL 2 support
      const testGl = canvas.getContext('webgl2');
      if (!testGl) {
        errorOverlay.style.display = 'flex';
        return;
      }

      // Collect available presets
      const presets = Object.assign(
        {},
        (window.butterchurnPresets && (window.butterchurnPresets.getPresets || window.butterchurnPresets.default?.getPresets))?.() || {},
        (window.butterchurnPresetsExtra && (window.butterchurnPresetsExtra.getPresets || window.butterchurnPresetsExtra.default?.getPresets))?.() || {}
      );
      const presetNames = Object.keys(presets);
      if (presetNames.length === 0) {
        console.warn('Keine Butterchurn-Presets geladen!');
      }

      // Application State
      let state = {
        type: 'state',
        preset: presetNames[0] || '',
        blend: 2.0,
        autoBars: 8,
        random: true,
        locked: false,
        gain: 1.0,
        brightness: 1.0
      };

      // Transport & Audio tracking
      let currentBpm = 0;
      let currentPlaying = false;
      let currentBeat = 0;
      let currentTsNum = 4;
      let currentTsDen = 4;
      let lastAudioTime = 0;

      // Auto-switching state
      let lastSwitchedBar = null;
      let lastBar = null;
      let lastSwitchTime = performance.now();
      let hasReceivedInitialState = false;

      // Silence buffers (1024 samples, 128 = 0)
      const silence1024 = new Uint8Array(1024).fill(128);
      let currentAudioLevels = {
        timeByteArray: silence1024,
        timeByteArrayL: silence1024,
        timeByteArrayR: silence1024
      };

      // Initialize Butterchurn
      const bc = window.butterchurn?.default || window.butterchurn;
      let visualizer = null;
      try {
        visualizer = bc.createVisualizer(null, canvas, {
          width: window.innerWidth,
          height: window.innerHeight,
          pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
        });
      } catch (err) {
        console.error('Butterchurn Initialisierungsfehler:', err);
        errorOverlay.style.display = 'flex';
        errorOverlay.querySelector('p').textContent = err.message;
        return;
      }

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        if (visualizer) {
          visualizer.setRendererSize(w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      function loadPreset(name, blendTime) {
        if (!visualizer) return;
        const targetName = (name && presets[name]) ? name : presetNames[0];
        if (targetName && presets[targetName]) {
          try {
            visualizer.loadPreset(presets[targetName], typeof blendTime === 'number' ? blendTime : state.blend);
            state.preset = targetName;
          } catch (e) {
            console.error('Fehler beim Laden des Presets:', targetName, e);
          }
        }
      }

      // Initial preset load
      if (state.preset) {
        loadPreset(state.preset, 0.0);
      }

      function applyExtraVisualSettings() {
        const brightness = typeof state.brightness === 'number' ? state.brightness : 1.0;
        canvas.style.filter = brightness !== 1.0 ? `brightness(${brightness})` : '';
      }

      function pickNextPreset(isRandom) {
        if (presetNames.length <= 1) return presetNames[0] || '';
        if (isRandom) {
          let pick = state.preset;
          let guard = 0;
          while (pick === state.preset && guard < 15) {
            const idx = Math.floor(Math.random() * presetNames.length);
            pick = presetNames[idx];
            guard++;
          }
          return pick;
        } else {
          const idx = presetNames.indexOf(state.preset);
          const nextIdx = (idx >= 0 ? idx + 1 : 0) % presetNames.length;
          return presetNames[nextIdx];
        }
      }

      function triggerAutoSwitch(now, bar) {
        if (state.locked || !state.autoBars || state.autoBars <= 0) return;
        const next = pickNextPreset(state.random);
        if (!next || next === state.preset) return;

        state.preset = next;
        loadPreset(state.preset, state.blend);
        lastSwitchTime = now;
        if (bar !== null) {
          lastSwitchedBar = bar;
        }

        // Display sends the new state to the server so remotes stay in sync
        socket.sendState(state);
      }

      function checkAutoSwitch(now) {
        if (state.locked || !state.autoBars || state.autoBars <= 0 || presetNames.length <= 1) {
          return;
        }

        const beatsPerBar = (currentTsNum || 4) * (4 / (currentTsDen || 4));

        if (currentPlaying && currentBpm > 0) {
          const currentBar = Math.floor(currentBeat / beatsPerBar);
          if (lastBar === null) {
            lastBar = currentBar;
          }

          // Bar boundary check aligned with autoBars
          const isTargetBar = ((currentBar % state.autoBars) + state.autoBars) % state.autoBars === 0;
          if (isTargetBar && currentBar !== lastSwitchedBar && currentBar >= lastBar) {
            triggerAutoSwitch(now, currentBar);
          }
          lastBar = currentBar;
        } else {
          // Fallback interval when playback is stopped or bpm is 0
          const barSeconds = currentBpm > 0 ? (beatsPerBar * 60) / currentBpm : 2.0;
          const intervalMs = state.autoBars * barSeconds * 1000;
          if (now - lastSwitchTime >= intervalMs) {
            triggerAutoSwitch(now, null);
          }
        }
      }

      // Render loop
      function renderFrame(timestamp) {
        requestAnimationFrame(renderFrame);

        checkAutoSwitch(timestamp);

        // Check audio freshness: if silence or no audio received recently, zero out
        let levels = currentAudioLevels;
        if (performance.now() - lastAudioTime > 250) {
          levels = {
            timeByteArray: silence1024,
            timeByteArrayL: silence1024,
            timeByteArrayR: silence1024
          };
        }

        if (visualizer) {
          visualizer.render({ audioLevels: levels });
        }
      }
      requestAnimationFrame(renderFrame);

      // WebSocket Connection
      const socket = new VisualizerSocket({
        role: 'display',
        onStatus: (status) => {
          if (status === 'connected') {
            statusBadge.style.display = 'none';
          } else {
            statusBadge.style.display = 'flex';
          }
        },
        onState: (incomingState) => {
          hasReceivedInitialState = true;
          const prevPreset = state.preset;
          state = { ...state, ...incomingState };

          if (state.preset && state.preset !== prevPreset) {
            loadPreset(state.preset, state.blend);
            lastSwitchTime = performance.now();
            const beatsPerBar = (currentTsNum || 4) * (4 / (currentTsDen || 4));
            lastSwitchedBar = Math.floor(currentBeat / beatsPerBar);
          }

          applyExtraVisualSettings();
        },
        onTransport: (transport) => {
          if (typeof transport.bpm === 'number') currentBpm = transport.bpm;
          if (typeof transport.playing === 'boolean') currentPlaying = transport.playing;
          if (typeof transport.beat === 'number') currentBeat = transport.beat;
          if (typeof transport.tsNum === 'number') currentTsNum = transport.tsNum;
          if (typeof transport.tsDen === 'number') currentTsDen = transport.tsDen;
        },
        onAudio: ({ flags, playing, N, bpm, beat, left, right }) => {
          lastAudioTime = performance.now();
          currentPlaying = playing;
          currentBpm = bpm;
          currentBeat = beat;

          const gain = typeof state.gain === 'number' ? state.gain : 1.0;
          const len = Math.min(N, 1024);

          const procL = new Uint8Array(1024);
          const procR = new Uint8Array(1024);
          const procMono = new Uint8Array(1024);

          if (gain === 1.0) {
            procL.set(left.subarray(0, len));
            procR.set(right.subarray(0, len));
            for (let i = 0; i < len; i++) {
              procMono[i] = (procL[i] + procR[i]) >> 1;
            }
          } else {
            for (let i = 0; i < len; i++) {
              let l = 128 + Math.round((left[i] - 128) * gain);
              let r = 128 + Math.round((right[i] - 128) * gain);
              procL[i] = l < 0 ? 0 : (l > 255 ? 255 : l);
              procR[i] = r < 0 ? 0 : (r > 255 ? 255 : r);
              procMono[i] = (procL[i] + procR[i]) >> 1;
            }
          }

          if (len < 1024) {
            procL.fill(128, len);
            procR.fill(128, len);
            procMono.fill(128, len);
          }

          currentAudioLevels = {
            timeByteArray: procMono,
            timeByteArrayL: procL,
            timeByteArrayR: procR
          };
        }
      });

      // Send initial state if server didn't provide one shortly after connect
      setTimeout(() => {
        if (!hasReceivedInitialState && socket.ws && socket.ws.readyState === WebSocket.OPEN) {
          socket.sendState(state);
        }
      }, 600);

      // Fullscreen handling (Click or 'F' key)
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullscreen();
        }
      });
      canvas.addEventListener('click', toggleFullscreen);

      // Hide mouse cursor when idle
      let cursorTimeout = null;
      function onPointerActivity() {
        document.body.style.cursor = 'default';
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => {
          document.body.style.cursor = 'none';
        }, 2500);
      }
      window.addEventListener('mousemove', onPointerActivity);
      window.addEventListener('mousedown', onPointerActivity);
      window.addEventListener('touchstart', onPointerActivity);
      onPointerActivity();
    })();
  </script>
</body>
</html>
