<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>CLAP Visualizer - Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #visualizer-canvas, .deck-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    [hidden] { display: none !important; }
    #status-badge {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.825rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    #status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f87171;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    /* Sound switch: appears on touch or pointer movement, so a projector picture stays clean. */
    #sound {
      position: fixed; left: 1.5rem; bottom: 1.5rem; z-index: 1000;
      padding: 0.7rem 1.1rem; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(18, 18, 24, 0.85); color: #e2e8f0; font: 500 0.95rem system-ui, sans-serif;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    body.awake #sound, body.embedded #sound { opacity: 1; pointer-events: auto; }
    #error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f87171;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      z-index: 2000;
    }
    #error-overlay h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <canvas id="visualizer-canvas"></canvas>

  <div id="status-badge" style="display: none;">
    <span class="dot"></span>
    <span id="status-text">Disconnected &middot; reconnecting...</span>
  </div>

  <button id="sound" type="button">🔇 Sound off</button>

  <div id="error-overlay">
    <h1>WebGL 2 required</h1>
    <p>This browser does not support WebGL 2, or hardware acceleration is disabled.</p>
  </div>

  <script src="vendor/butterchurn.min.js"></script>
  <script src="vendor/butterchurnPresets.min.js"></script>
  <script src="vendor/butterchurnPresetsExtra.min.js"></script>
  <script src="ws.js"></script>
  <script src="postfx.js"></script>
  <script src="viz.js"></script>
  <script src="tags.js"></script>
  <script src="engine.js"></script>
  <script>
    window.vj = VJEngine.start();
    const sound = document.getElementById('sound'); let asleep;
    // Inside the start page (display + remote) the switch stays visible.
    if (parent !== window) document.body.classList.add('embedded');
    const wake = () => { document.body.classList.add('awake'); clearTimeout(asleep); asleep = setTimeout(() => document.body.classList.remove('awake'), 4000); };
    addEventListener('pointermove', wake); addEventListener('pointerdown', wake); wake();
    sound.onclick = () => { if (vj) sound.textContent = vj.socket.listen(!vj.socket.listening) ? '🔊 Sound on' : '🔇 Sound off'; };
  </script>
</body>
</html>
